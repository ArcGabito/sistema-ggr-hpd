# Backend → Azure Container Apps.
# Construye la imagen en GitHub, la publica en GitHub Container Registry (gratis; no se usa Azure
# Container Registry, que es de pago) y actualiza la container app. Azure se autentica con OIDC:
# en el repositorio solo se guardan los IDs de la identidad, sin contraseñas.
name: Backend

on:
  push:
    branches: [master]
    paths:
      - core/server/**
      - docker/Dockerfile.server
      - .github/workflows/backend.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: backend-deploy
  cancel-in-progress: false

env:
  IMAGEN: ghcr.io/arcgabito/sistema-ggr-hpd-api
  GRUPO: rg-hpd-glass-group
  APP: hpd-api

jobs:
  deploy:
    name: Imagen y despliegue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.server
          push: true
          tags: |
            ${{ env.IMAGEN }}:${{ github.sha }}
            ${{ env.IMAGEN }}:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Desplegar la imagen nueva
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          # La app y su configuración (secretos, variables) se crean una vez con Azure CLI;
          # este paso solo cambia la imagen.
          if ! az containerapp show -g "$GRUPO" -n "$APP" -o none 2>/dev/null; then
            echo "::warning::La container app $APP aún no existe: la imagen quedó publicada en GHCR."
            exit 0
          fi
          az containerapp update -g "$GRUPO" -n "$APP" --image "$IMAGEN:${{ github.sha }}" -o none
          echo "Desplegado $IMAGEN:${{ github.sha }} en $APP" >> "$GITHUB_STEP_SUMMARY"
