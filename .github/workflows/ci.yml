name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Client · Next.js
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/client
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: core/client/package-lock.json

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  server:
    name: Server · ASP.NET Core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restaurar dependencias
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

  docker:
    name: Docker · imágenes
    runs-on: ubuntu-latest
    needs: [client, server]
    steps:
      - uses: actions/checkout@v7

      - name: Validar docker-compose
        run: docker compose --env-file .env.example -f docker/docker-compose.yml config --quiet

      - name: Construir imágenes
        run: docker compose --env-file .env.example -f docker/docker-compose.yml build

  audit:
    name: Auditoría de dependencias
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: npm audit
        working-directory: core/client
        run: npm audit --audit-level=high

      - name: NuGet vulnerables
        working-directory: core/server
        run: |
          dotnet restore
          dotnet list package --vulnerable --include-transitive | tee vulnerable.txt
          ! grep -q "has the following vulnerable packages" vulnerable.txt
