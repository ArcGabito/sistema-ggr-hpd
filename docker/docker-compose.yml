name: sistema-ggr-hpd

services:
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: hpd-ggr-database
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_SA_PASSWORD:?Define DB_SA_PASSWORD en .env}
      MSSQL_PID: ${MSSQL_PID:-Developer}
    ports:
      - "${DATABASE_PORT:-1433}:1433"
    volumes:
      - database-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  mailpit:
    # Buzón de desarrollo: captura los correos que envía la API (interfaz web en MAILPIT_PORT).
    image: axllent/mailpit:v1.32.0
    container_name: hpd-ggr-mailpit
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
    restart: unless-stopped

  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    image: sistema-ggr-hpd/server:latest
    container_name: hpd-ggr-server
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: "Server=database,1433;Database=${DB_NAME:-HpdGgr};User Id=sa;Password=${DB_SA_PASSWORD};TrustServerCertificate=True;Encrypt=True"
      Jwt__Key: ${JWT_KEY:?Define JWT_KEY en .env}
      Jwt__Issuer: ${JWT_ISSUER:-hpd-ggr-server}
      Jwt__Audience: ${JWT_AUDIENCE:-hpd-ggr-client}
      Jwt__ExpirationMinutes: ${JWT_EXPIRATION_MINUTES:-480}
      Cors__AllowedOrigins__0: http://localhost:${CLIENT_PORT:-3000}
      SeedAdmin__FullName: ${SEED_ADMIN_NAME:-Administrador HPD}
      SeedAdmin__Email: ${SEED_ADMIN_EMAIL:?Define SEED_ADMIN_EMAIL en .env}
      SeedAdmin__Password: ${SEED_ADMIN_PASSWORD:?Define SEED_ADMIN_PASSWORD en .env}
      Smtp__Host: ${SMTP_HOST:-mailpit}
      Smtp__Port: ${SMTP_PORT:-1025}
      Smtp__Security: ${SMTP_SECURITY:-None}
      Smtp__Username: ${SMTP_USERNAME:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__FromAddress: ${SMTP_FROM_ADDRESS:-no-reply@hpdglass.com}
      Smtp__FromName: ${SMTP_FROM_NAME:-HPD Glass Group}
    ports:
      - "${SERVER_PORT:-5040}:8080"
    depends_on:
      database:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped

  client:
    build:
      context: ..
      dockerfile: docker/Dockerfile.client
      args:
        SITE_URL: ${SITE_URL:-http://localhost:3000}
    image: sistema-ggr-hpd/client:latest
    container_name: hpd-ggr-client
    environment:
      API_URL: http://server:8080
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "${CLIENT_PORT:-3000}:3000"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  database-data:
    name: sistema-ggr-hpd-database-data
